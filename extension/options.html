<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页视频遥控器 · 选项</title>
<style>
  :root {
    --accent: #76d6ff;
    --accent2: #9e8eff;
    --gold: #f4d58d;
    --text: #ebf3ff;
    --sub: #9eaec6;
    --dim: #70829f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 36px 24px;
    font: 14px/1.7 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 420px at 88% -8%, rgba(118, 214, 255, .20), transparent 62%),
      radial-gradient(760px 420px at 0% 108%, rgba(158, 142, 255, .18), transparent 60%),
      linear-gradient(160deg, #0b1123 0%, #0a1226 55%, #070c18 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .shell { width: 100%; max-width: 560px; }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(140deg, #16244a, #0c1428);
    border: 1px solid rgba(118, 214, 255, .55);
    box-shadow: 0 0 18px rgba(118, 214, 255, .30);
    display: flex; align-items: center; justify-content: center;
  }
  .mark::after {
    content: ""; width: 0; height: 0;
    border-left: 11px solid var(--accent);
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    margin-left: 3px;
    filter: drop-shadow(0 0 5px rgba(118, 214, 255, .9));
  }
  .brand-text b { display: block; font-size: 15px; letter-spacing: .5px; }
  .brand-text span { display: block; font-size: 10px; letter-spacing: 2.4px; color: var(--dim); }

  .card {
    position: relative;
    padding: 26px 24px 22px;
    border-radius: 16px;
    background: linear-gradient(165deg, rgba(22, 34, 62, .92), rgba(15, 25, 47, .94));
    border: 1px solid rgba(118, 214, 255, .22);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .card::before, .card::after {
    content: ""; position: absolute; width: 6px; height: 6px;
    background: var(--gold); transform: rotate(45deg); opacity: .75;
  }
  .card::before { top: -3px; left: 26px; }
  .card::after { top: -3px; right: 26px; }

  h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  p.hint { color: var(--sub); font-size: 12.5px; margin: 0 0 20px; }

  label {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; margin-bottom: 10px;
    border: 1px solid rgba(118, 214, 255, .16);
    border-radius: 11px;
    background: rgba(255, 255, 255, .025);
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .18s;
  }
  label:hover { border-color: rgba(118, 214, 255, .45); background: rgba(118, 214, 255, .07); }
  label:has(input:checked) {
    border-color: rgba(118, 214, 255, .75);
    background: linear-gradient(90deg, rgba(118, 214, 255, .16), rgba(158, 142, 255, .10));
    box-shadow: 0 0 20px rgba(118, 214, 255, .14);
  }
  input[type="radio"] { accent-color: #76d6ff; width: 16px; height: 16px; margin: 0; }
  .rate { font-weight: 600; min-width: 34px; }
  .desc { color: var(--sub); font-size: 12.5px; }
  .tag {
    margin-left: auto; font-size: 11px; color: var(--gold);
    border: 1px solid rgba(244, 213, 141, .35);
    border-radius: 20px; padding: 1px 9px;
  }
  #st { min-height: 22px; margin: 14px 0 0; font-size: 12.5px; color: #7fe6b0; }
  .foot { margin-top: 18px; font-size: 11.5px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="mark"></div>
      <div class="brand-text"><b>网页视频遥控器</b><span>BRIDGE OPTIONS</span></div>
    </div>

    <div class="card">
      <h1>长按倍率</h1>
      <p class="hint">长按 → 时使用的播放速度；松开后回到 1x。遥控器（exe）长按也使用这里的设置。</p>

      <label>
        <input type="radio" name="rate" value="1.5">
        <span class="rate">1.5x</span>
        <span class="desc">温和加速</span>
      </label>
      <label>
        <input type="radio" name="rate" value="2">
        <span class="rate">2x</span>
        <span class="desc">默认，手感接近原生长按</span>
        <span class="tag">推荐</span>
      </label>
      <label>
        <input type="radio" name="rate" value="3">
        <span class="rate">3x</span>
        <span class="desc">快速掠过</span>
      </label>

      <p id="st"></p>
    </div>

    <div class="foot">只与 127.0.0.1:17777 上的本机程序通信 · 不联网</div>
  </div>
  <script src="options.js"></script>
</body>
</html>
